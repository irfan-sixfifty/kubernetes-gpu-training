apiVersion: apps/v1
kind: Deployment
metadata:
  name: irfanshaik-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: irfanshaik-deployment
  template:
    metadata:
      labels:
        app: irfanshaik-deployment
    spec:
      containers:
        - name: irfanshaik-container
          image: pytorch/pytorch:2.4.1-cuda12.1-cudnn9-runtime
          command: ["sleep", "infinity"]
          resources:
            requests:
              cpu: "1"
              memory: "4Gi"
              nvidia.com/gpu: "1"
            limits:
              cpu: "2"
              memory: "8Gi"
              nvidia.com/gpu: "1"
          volumeMounts:
            - mountPath: /pvcvolume
              name: irfanshaik-storage
      volumes:
        - name: irfanshaik-storage
          persistentVolumeClaim:
            claimName: irfanshaik-task3
